dataset: ./data/temp_dummy.csv
test_cases: ./data/test_cases.json
output_dir: ./results

sample_sizes: [100]
top_k: 10
timing_repeats: 5
embedding_model: sentence-transformers/all-MiniLM-L6-v2

stores:
  usearch:
    enabled: true
    variants:
      - name: "USearch (Cosine)"
        params:
          metric: cos
      - name: "USearch (L2)"
        params:
          metric: l2
