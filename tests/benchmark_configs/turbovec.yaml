dataset: ./data/temp_dummy.csv
test_cases: ./data/test_cases.json
output_dir: ./results

sample_sizes: [100]
top_k: 10
timing_repeats: 5
embedding_model: sentence-transformers/all-MiniLM-L6-v2

stores:
  turbovec:
    enabled: true
    variants:
      - name: "TurboVec (3-bit)"
        params:
          bit_width: 3

      - name: "TurboVec (4-bit)"
        params:
          bit_width: 4

      - name: "TurboVec (2-bit)"
        params:
          bit_width: 2
