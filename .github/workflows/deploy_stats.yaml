name: deploy-stats
on:
  push:
    branches:
      - main
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare page artifact
        run: |
          mkdir -p public
          cp docs/index.html public/index.html
          touch public/.nojekyll
          echo "Contents of public directory:"
          ls -la public/
      - name: Display file sizes
        run: |
          echo "index.html size:"
          wc -c public/index.html
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment