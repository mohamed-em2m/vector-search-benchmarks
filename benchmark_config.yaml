# ═══════════════════════════════════════════════════════════════
#  Vector Search Benchmark — Configuration File
# ═══════════════════════════════════════════════════════════════
#
# Usage:
#   python run_benchmark.py --config benchmark_config.yaml --samples 500
#   python run_all.py       --config benchmark_config.yaml
#
# CLI arguments still work. If --config is provided, YAML values
# take priority over CLI defaults.
# ═══════════════════════════════════════════════════════════════


# ── Paths ───────────────────────────────────────────────────────
dataset: ./data/temp_dummy.csv
test_cases: ./data/test_cases.json
output_dir: ./results


# ── Benchmark Settings ──────────────────────────────────────────
# samples: 500                   # for run_benchmark.py (or use --samples)
sample_sizes: [500, 5000, 50000, 500000] # ,250000,500000,1000000]      # for run_all.py (overrides the default list)
top_k: 5
timing_repeats: 5
embedding_model: sentence-transformers/all-MiniLM-L6-v2
# memray: false                  # set true to enable memray profiling (Linux/macOS only)


# ── Stores ──────────────────────────────────────────────────────
# Each key must match a registered store name.
# Set  enabled: false  to skip a store entirely.
# Use  variants  to run the same store with different parameters.
# Each variant gets its own row in the benchmark results.
# The "params" dict is passed as **kwargs to the store's build() method.
#
# If a store has no "variants" list, it runs once with default settings.
# ────────────────────────────────────────────────────────────────

stores:

  # ── Baseline (LangChain InMemoryVectorStore) ─────────────────
  baseline:
    enabled: true

  # ── FAISS ────────────────────────────────────────────────────
  # Supported index_type values:
  #   flat_l2   — Exact L2 search (default)
  #   flat_ip   — Exact inner-product search
  #   hnsw      — HNSW graph index
  #   ivf_pq    — IVF + Product Quantization
  #               params: nlist (clusters), m (sub-quantizers), nbits (bits per code)
  #   sq        — Scalar Quantization
  #               params: qtype (QT_8bit, QT_4bit, QT_fp16, etc.)
  faiss:
    enabled: true
    variants:
      - name: "FAISS (FlatL2)"
        params:
          index_type: flat_l2

      # - name: "FAISS (FlatIP)"
      #   params:
      #     index_type: flat_ip

      #- name: "FAISS (HNSW)"
      #  params:
      #    index_type: hnsw
      #    hnsw_m: 32              # number of connections per layer
      #    efConstruction: 200     # construction-time search width
      #    efSearch: 128           # query-time search width

      - name: "FAISS (IVF+PQ)"
        params:
          index_type: ivf_pq
          nlist: 100              # number of Voronoi cells
          m: 8                    # number of sub-quantizers
          nbits: 8                # bits per sub-quantizer code
      #     nprobe: 10              # cells to visit at query time

      - name: "FAISS (SQ8)"
        params:
          index_type: sq
          qtype: QT_8bit

      - name: "FAISS (SQ4)"
        params:
          index_type: sq
          qtype: QT_4bit

  # ── TurboVec ─────────────────────────────────────────────────
  # params: bit_width (integer, default 3)
  turbovec:
    enabled: true
    variants:
      - name: "TurboVec (3-bit)"
        params:
          bit_width: 3

      - name: "TurboVec (4-bit)"
        params:
          bit_width: 4

      - name: "TurboVec (2-bit)"
        params:
          bit_width: 2

  # ── Qdrant (in-memory) ───────────────────────────────────────
  # quantization: null | "scalar" | "product"
  #
  # scalar options:
  #   scalar_type: "int8"          (only INT8 supported, gives 4x memory reduction)
  #   scalar_quantile: 0.99        (trims outliers; higher = more accurate mapping)
  #   scalar_always_ram: true      (keep quantized index in RAM)
  #
  # product options:
  #   pq_compression: x4|x8|x16|x32|x64  (compression ratio vs baseline)
  #   pq_always_ram: true
  qdrant:
    enabled: true
    variants:
      - name: "Qdrant (float32)"
        params: {}

      - name: "Qdrant (Scalar INT8)"
        params:
          quantization: scalar
          scalar_quantile: 0.99
          scalar_always_ram: true

      - name: "Qdrant (Product x16)"
        params:
          quantization: product
          pq_compression: x16
          pq_always_ram: true

      # - name: "Qdrant (Product x4)"
      #   params:
      #     quantization: product
      #     pq_compression: x4

      # - name: "Qdrant (Product x32)"
      #   params:
      #     quantization: product
      #     pq_compression: x32

  # ── USearch (HNSW) ───────────────────────────────────────────
  # params:
  #   metric: cos | l2 | ip       (default: cos)
  #   connectivity: int            (HNSW M parameter, default: library default)
  #   expansion_add: int           (efConstruction, default: library default)
  #   expansion_search: int        (efSearch, default: library default)
  usearch:
    enabled: true
    # variants:
    #   - name: "USearch (cos)"
    #     params:
    #       metric: cos
    #   - name: "USearch (L2)"
    #     params:
    #       metric: l2

  # ── ScaNN (Google) ───────────────────────────────────────────
  # params:
  #   mode: auto | brute_force | tree_ah   (default: auto)
  #   num_leaves: int              (tree partitions, default: sqrt(n))
  #   num_leaves_to_search: int    (partitions probed, default: num_leaves/5)
  #   reorder_num: int             (reordering depth, default: 200)
  scann:
    enabled: true
    # variants:
    #   - name: "ScaNN (brute force)"
    #     params:
    #       mode: brute_force
    #   - name: "ScaNN (Tree-AH)"
    #     params:
    #       mode: tree_ah
    #       num_leaves: 100
    #       num_leaves_to_search: 20
    #       reorder_num: 200
